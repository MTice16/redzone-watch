<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Red Zone Watch</title>
<meta name="theme-color" content="#0b130e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Red Zone">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>body{margin:0;background:#0b130e;color:#9fb2a4;font:14px ui-monospace,Consolas,monospace;display:grid;place-items:center;height:100vh;text-align:center}</style>
</head><body>
<p id="m">Red Zone Watch start page (launcher 1.5)<br>Opening newest version…</p>
<script>
// Start page. LATEST is written into this file every update; version.json can only move it forward.
const LATEST = "1.5";
const num = v => { const [a,b] = String(v).split(".").map(Number); return (a||0)*1000 + (b||0); };
fetch("version.json?t=" + Date.now(), {cache: "no-store"})
  .then(r => r.json()).then(j => j.version).catch(() => LATEST)
  .then(v => { const pick = num(v) > num(LATEST) ? v : LATEST;
    document.getElementById("m").innerHTML += "<br>→ v" + pick;
    location.replace("index-" + pick + ".html?t=" + Date.now()); });
</script>
</body></html>
