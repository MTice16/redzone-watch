<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Red Zone Watch</title>
<meta name="theme-color" content="#0b130e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Red Zone">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>body{margin:0;background:#0b130e;color:#9fb2a4;font:14px system-ui,sans-serif;display:grid;place-items:center;height:100vh}</style>
</head><body>
<p id="m">Opening latest version…</p>
<script>
// Launcher: never needs to change. It reads version.json (fresh every time) and opens index-X.Y.html.
const FALLBACK = "1.1";
fetch("version.json?t=" + Date.now(), {cache: "no-store"})
  .then(r => r.json()).then(j => j.version).catch(() => FALLBACK)
  .then(v => location.replace("index-" + v + ".html"));
</script>
</body></html>
